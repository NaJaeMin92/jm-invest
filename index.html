<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2f5fa">
<title>내 계좌</title>
<link rel="stylesheet" href="./style.css?v=8">
<script type="module" src="./journal.js?v=7"></script>
</head>
<body class="trade-page">
<header><div class="head"><a href="./" class="brand-home" aria-label="내 계좌 홈"><span class="identity-mark identity-jm" aria-hidden="true">JM</span></a><button id="logout" type="button" hidden>로그아웃</button></div></header>
<main id="account">
<h1 id="page-heading">내 계좌</h1>
<section class="panel">
<form id="login">
<label>이메일<input name="email" type="email" autocomplete="username" required></label>
<label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
<label class="remember"><input type="checkbox" name="remember">이 기기에서 로그인 유지</label>
<button class="primary">로그인</button>
</form>
<div id="private" hidden>
<section id="account-home" aria-label="투자 계좌">
<div class="total-row">
<span class="ledger-icon" aria-hidden="true"><i></i><i></i><i></i></span>
<div class="balance-summary">
<h2>연동 계좌 평가액</h2>
<strong id="portfolio-value" class="portfolio-value">조회 중…</strong>
</div>
</div>
<button class="broker-row" id="open-kiwoom" type="button" aria-controls="trade-detail">
<span class="identity-mark identity-kiwoom" aria-hidden="true">K</span>
<span class="broker-name"><strong id="kiwoom-value" hidden></strong><span class="broker-caption">키움증권 <small id="kiwoom-return"></small></span></span>
<span class="row-action">체결 보기</span>
</button>
<div class="broker-row">
<span class="identity-mark identity-samsung" aria-hidden="true">S</span>
<div class="broker-name"><strong>삼성증권</strong><small>종합매매</small></div>
<span class="row-status">미연동</span>
</div>
<div class="balance-footer"><strong>투자 계좌</strong><span id="valuation-note"></span></div>

</section>
<section id="trade-detail" hidden>
<button type="button" id="back-accounts">‹ 계좌 목록</button>
<h2>종목별 체결가</h2>
<label>종목<select id="trade-symbol"></select></label>
<div id="trade-chart"></div>
<h2>키움 체결 내역</h2><ul id="fills"></ul>
</section>
</div>
<p id="status" role="status"></p>
</section>
</main>
</body>
</html>
