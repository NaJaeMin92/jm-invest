<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f17">
<title>내 계좌</title>
<link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..850&amp;display=swap">
<link rel="stylesheet" href="./style.css?v=26">
<script type="module" src="./journal.js?v=27"></script>
</head>
<body class="trade-page">
<header><div class="head"><a href="./" class="brand-home" aria-label="내 계좌 홈"><img src="./assets/mark.svg" width="36" height="36" alt=""></a></div></header>
<main id="account">
<div class="page-title"><button type="button" id="back-accounts" aria-label="계좌 목록으로 돌아가기" hidden>‹</button><h1 id="page-heading">내 계좌</h1></div>
<section class="panel">
<form id="login">
<label>이메일<input name="email" type="email" autocomplete="username" required></label>
<label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
<label class="remember"><input type="checkbox" name="remember">이 기기에서 로그인 유지</label>
<button class="primary">로그인</button>
</form>
<div id="private" hidden>
<section id="tab-home" class="tab-panel" hidden>
<h2>투자 현황</h2>
<strong id="home-value" class="portfolio-value">조회 중…</strong>
</section>
<section id="tab-profit" class="tab-panel" hidden>
<h2>미국주식 실현손익</h2>
<p id="profit-period"></p>
<strong id="profit-total" class="portfolio-value">동기화 대기</strong>
<p id="profit-updated"></p>
<ul id="profit-list"></ul>
</section>
<section id="tab-more" class="tab-panel" hidden>
<h2>설정</h2>
<button id="logout" type="button">로그아웃</button>
</section>
<div id="tab-account">
<section id="account-home" aria-label="투자 계좌">
<div class="total-row">
<span class="ledger-icon" aria-hidden="true"><i></i><i></i><i></i></span>
<div class="balance-summary">
<h2>연동 계좌 평가액</h2>
<strong id="portfolio-value" class="portfolio-value">조회 중…</strong>
</div>
</div>
<button class="broker-row" id="open-kiwoom" type="button" aria-controls="trade-detail">
<img class="broker-logo" src="./assets/kiwoom-global.jpg" width="44" height="44" alt="">
<span class="broker-name"><strong id="kiwoom-value" hidden></strong><span class="broker-caption">키움증권 <small id="kiwoom-return"></small></span></span>
<span class="account-chevron" aria-hidden="true">›</span>
</button>
<div class="broker-row">
<img class="broker-logo" src="./assets/samsung.jpg" width="44" height="44" alt="">
<div class="broker-name"><strong>삼성증권</strong><small>종합매매</small></div>
<span class="row-status">미연동</span>
</div>
<div class="balance-footer"><strong>투자 계좌</strong><span id="valuation-note"></span></div>

</section>
<section id="trade-detail" hidden>

<section class="allocation" aria-labelledby="allocation-heading">
<h2 id="allocation-heading">총 투자 자산</h2>
<strong id="allocation-total" class="allocation-total" aria-live="polite">조회 중…</strong>
<div id="allocation-breakdown" hidden>
<div class="allocation-bar" role="img" id="allocation-bar" aria-label="주식과 예수금 비중"></div>
<button type="button" class="allocation-row allocation-button" id="open-holdings" aria-haspopup="dialog">
<div><strong>해외 주식</strong><small id="stock-share">미국주식</small></div>
<div><strong id="allocation-value"></strong><small id="allocation-return"></small></div>
</button>
</div>
<div class="allocation-row" style="--category-color:#ac82ff"><strong>채권·RP·금·기타</strong><small>미연동</small></div>
<div class="allocation-row" style="--category-color:#e3a450"><strong>펀드</strong><small>미연동</small></div>
<div class="allocation-row" style="--category-color:#54c998"><strong>국내 주식</strong><small>미연동</small></div>
<div class="allocation-row" style="--category-color:#8791a0"><div><strong>예수금</strong><small id="cash-share"></small></div><div><strong id="cash-value">동기화 대기</strong><small id="cash-breakdown"></small></div></div>
</section>

</section>
</div>
</div>
<dialog id="holdings-dialog" aria-labelledby="holdings-title">
<div class="sheet-header"><div><h2 id="holdings-title">해외 주식</h2><p id="holdings-summary"></p></div></div>
<ul id="holdings-list"></ul>
<button id="close-holdings" class="sheet-close" type="button">닫기</button>
</dialog>
<nav id="bottom-nav" aria-label="주 메뉴" hidden>
<button type="button" data-view="home"><span aria-hidden="true">⌂</span>홈</button>
<button type="button" data-view="account" aria-current="page"><span aria-hidden="true">▤</span>내 계좌</button>
<button type="button" data-view="profit"><span aria-hidden="true">◫</span>실현손익 조회</button>
<button type="button" data-view="more"><span aria-hidden="true">☰</span>더보기</button>
</nav>
<p id="status" role="status"></p>
</section>
</main>
</body>
</html>
