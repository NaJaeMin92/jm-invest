name: Refresh market calendar

on:
  schedule:
    - cron: '35 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-market-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Fetch public schedules and publish successful updates
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/calendar-publish"
          if git ls-remote --exit-code --heads origin market-data; then
            git fetch origin refs/heads/market-data:refs/remotes/origin/market-data
            git worktree add --detach "$dest" refs/remotes/origin/market-data
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            git worktree add --detach "$dest"
            git -C "$dest" switch --orphan market-data
          fi
          failed=0
          for source in macro earnings; do
            file="calendar-$source.json"
            if python "scripts/refresh-$source.py" "$dest/$file"; then
              git -C "$dest" add "$file"
            else
              failed=1
            fi
          done
          if ! git -C "$dest" diff --cached --quiet; then
            git -C "$dest" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh market calendar"
            git -C "$dest" push origin HEAD:refs/heads/market-data
          fi
          exit "$failed"
