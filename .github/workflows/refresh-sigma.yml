name: Refresh SigmaRange data

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sigmarange

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the latest public snapshot
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/sigma-publish"
          if git ls-remote --exit-code --heads origin market-data; then
            git fetch origin refs/heads/market-data:refs/remotes/origin/market-data
            git worktree add --detach "$data_dir" refs/remotes/origin/market-data
          else
            status=$?
            if [[ "$status" -ne 2 ]]; then exit "$status"; fi
            git worktree add --detach "$data_dir"
            git -C "$data_dir" switch --orphan market-data
          fi
          python3 scripts/refresh-sigma.py "$data_dir/sigma.json"
          git -C "$data_dir" add sigma.json
          if git -C "$data_dir" diff --cached --quiet; then exit 0; fi
          git -C "$data_dir" -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Update SigmaRange snapshot"
          git -C "$data_dir" push origin HEAD:refs/heads/market-data
